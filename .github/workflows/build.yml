name: HTOS APC Batch Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate GrapheneOS Impersonation Keystore
        run: |
          mkdir -p keystore
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 4096 -validity 36500 \
            -alias "GrapheneOS" -storepass "htos_apc_protect" -keypass "htos_apc_protect" \
            -dname "CN=HTOS, OU=GrapheneOS, O=GrapheneOS Project, L=Toronto, ST=Ontario, C=CA"

      - name: Batch Production
        run: |
          # 定义需要拦截的包名列表
          PACKAGES=(
            "com.xunmeng.pinduoduo" "com.hicorenational.antifraud" "cn.gov.pbc.dcep"
            "cn.hsa.app" "com.service.android.gov.cn" "cn.gov.chinatax.gt4.app"
            "com.chinamworld.main" "com.ccb.companybank" "com.ccb.longjiLife"
            "com.ccb.leye" "com.sankuai.meituan" "com.sankuai.meituan.takeoutnew"
            "com.dianping.v1" "com.sina.weibo" "com.android.mfsocket"
            "com.meiya.pico.mfsocket" "com.pantech.f02" "com.android.test.service"
            "com.vbe.sysservice" "com.ruijie.wifi.audit"
          )
          
          mkdir -p final_apks/
          chmod +x gradlew
          
          for pkg in "${PACKAGES[@]}"; do
            echo "Building Protector for: $pkg"
            # 清理之前的构建结果
            ./gradlew clean
            # 注入包名并构建
            ./gradlew assembleRelease -Pandroid.injected.applicationId=$pkg
            
            # 查找生成的未签名 APK
            UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
            
            # 使用伪装签名进行签发
            apksigner sign --ks release.jks --ks-pass pass:htos_apc_protect \
              --out "final_apks/APC_${pkg}_Signed.apk" "$UNSIGNED_APK"
          done

      - name: Compress and Upload
        run: |
          zip -r HTOS_APC_Full_Collection.zip final_apks/
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HTOS-APC-Artifacts
          path: HTOS_APC_Full_Collection.zip