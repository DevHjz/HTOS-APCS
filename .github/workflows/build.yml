name: HTOS APC Batch Production

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Create GrapheneOS Keystore
        run: |
          # 签发者为 GrapheneOS，使用者为 HTOS
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 4096 -validity 36500 \
            -alias "GrapheneOS" -storepass "htos_apc_protect" -keypass "htos_apc_protect" \
            -dname "CN=HTOS, OU=GrapheneOS, O=GrapheneOS Project, L=Toronto, ST=Ontario, C=CA"

      - name: Loop Build APKs
        run: |
          # 填入你要求的所有真实包名
          PACKAGES=(
            "com.xunmeng.pinduoduo" "com.hicorenational.antifraud" "cn.gov.pbc.dcep"
            "cn.hsa.app" "com.service.android.gov.cn" "cn.gov.chinatax.gt4.app"
            "com.chinamworld.main" "com.ccb.companybank" "com.ccb.longjiLife"
            "com.ccb.leye" "com.sankuai.meituan" "com.sankuai.meituan.takeoutnew"
            "com.dianping.v1" "com.sina.weibo" "com.android.mfsocket"
            "com.meiya.pico.mfsocket" "com.pantech.f02" "com.android.test.service"
            "com.vbe.sysservice" "com.ruijie.wifi.audit" "cn.xuexi.android"
          )
          
          mkdir -p final_output/
          
          for pkg in "${PACKAGES[@]}"; do
            echo "--- Producing Squatting APK for: $pkg ---"
            # 通过 -Ppkg 参数将包名注入到 build.gradle 中
            ./gradlew :app:assembleRelease -Ppkg=$pkg --no-daemon
            
            # 找到生成的 APK 并签名
            RAW_APK=$(find app/build/outputs/apk/release/ -name "*.apk" ! -name "*-signed.apk" | head -n 1)
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.jks \
              --ks-pass pass:htos_apc_protect \
              --out "final_output/${pkg}_SQUAT.apk" "$RAW_APK"
            
            ./gradlew clean
          done

      - name: Package & Upload
        run: |
          zip -j HTOS_APC_Collection.zip final_output/*.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HTOS-APC-Artifacts
          path: HTOS_APC_Collection.zip